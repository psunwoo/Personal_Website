[project]
name = "rcf"
version = "0.1.0"
description = "Relational Concept Flow: body-order tests for affective/abstract concept activation over object sets"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "scipy>=1.14",
  "pandas>=2.2",
  "pyarrow>=17",
  "scikit-learn>=1.5",
  "pyyaml>=6",
  "torch>=2.5",
  "sentence-transformers>=3.3",
  "huggingface_hub>=0.26",
  "datasets>=3.0",
  "pillow>=10",
  "matplotlib>=3.9",
  "pytest>=8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
